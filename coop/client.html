<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROT &amp; RUIN — co-op</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b100a; overflow: hidden;
    font: 700 11px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #cfe3c6;
    -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #vig { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%); }
  .panel { position: fixed; background: rgba(6,10,6,0.55);
    border: 1px solid rgba(143,212,106,0.14); border-radius: 6px; padding: 10px 12px;
    pointer-events: none; }
  #vitals { top: 18px; left: 14px; width: 284px; }
  #vitals .label { color: #7f9a72; font-size: 10px; letter-spacing: 0.08em; }
  #bar { height: 14px; margin-top: 6px; background: #2a1512; border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.5); overflow: hidden; }
  #fill { height: 100%; width: 100%; background: #84c95f; transition: width 90ms linear; }
  #vrow { display: flex; justify-content: space-between; margin-top: 6px; color: #cfd9c7; }
  #score { top: 18px; right: 14px; width: 178px; text-align: right; }
  #score .label { color: #6f8a63; font-size: 10px; letter-spacing: 0.08em; }
  #wave { font-size: 32px; line-height: 1.05; color: #e8f3e0; }
  #score .row { color: #9fb396; font-size: 11px; }
  #weapon { left: 14px; bottom: 14px; min-width: 250px; }
  #wname { color: #6f8a63; font-size: 10px; letter-spacing: 0.08em; }
  #ammo { color: #f0d78a; font-size: 34px; line-height: 1.05; }
  #ammo small { color: #8fa387; font-size: 15px; }
  #peers { bottom: 14px; right: 14px; text-align: right; min-width: 120px; }
  #peers div { color: #9fb396; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #6f8a63; font-size: 10px; pointer-events: none; text-align: center;
    white-space: nowrap; }
  /* the panels own the bottom corners; on a narrow screen there is no room
     between them for the key hints, so they step aside */
  @media (max-width: 900px) { #hint { display: none; } }
  #state { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #e0705a; font-size: 13px; }
  #serverBtn { position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
    background: transparent; border: 1px solid rgba(143,212,106,0.22); color: #6f8a63;
    font: inherit; font-size: 10px; letter-spacing: 0.14em; padding: 5px 10px;
    text-transform: uppercase; cursor: pointer; border-radius: 4px; }
  #serverBtn:hover { color: #cfe3c6; }
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,8,5,0.86); padding: 24px; z-index: 20; }
  #setup[hidden] { display: none; }
  #setup .box { max-width: 440px; width: 100%; text-align: center; padding: 26px 28px;
    border: 1px solid #2c3a28; background: linear-gradient(180deg, rgba(18,26,16,0.97), rgba(10,14,9,0.97)); }
  #setup h2 { margin: 0 0 8px; font-size: 15px; letter-spacing: 0.2em; color: #e8f3e0; }
  #setup p { margin: 0 0 16px; color: #8fa387; font-size: 11px; line-height: 1.7; letter-spacing: 0.04em; }
  #setup input { width: 100%; padding: 9px 11px; background: #0d140c; color: #cfe3c6;
    font: inherit; font-size: 12px; border: 1px solid #2c3a28; }
  #setup input:focus { outline: none; border-color: #4c7a3d; }
  #setup .row { display: flex; gap: 8px; margin-top: 10px; }
  #setup button { flex: 1; background: transparent; border: 1px solid #2c3a28; color: #9fb396;
    font: inherit; font-size: 10px; letter-spacing: 0.16em; padding: 9px 12px;
    text-transform: uppercase; cursor: pointer; }
  #setup button.main { border-color: #4c7a3d; background: linear-gradient(180deg,#3d5f31,#2a4222); color: #eaf5e2; }
  /* ---- phone controls ---- */
  canvas { touch-action: none; }
  #touchBtns { position: fixed; right: 14px; bottom: 100px; display: none;
    flex-direction: column; gap: 10px; z-index: 12; }
  body.touch #touchBtns { display: flex; }
  body.touch #peers { bottom: 100px; }
  #touchBtns button { width: 62px; height: 62px; border-radius: 50%;
    background: rgba(6,10,6,0.55); border: 1px solid rgba(143,212,106,0.32);
    color: #cfe3c6; font: inherit; font-size: 10px; letter-spacing: .06em;
    text-transform: uppercase; touch-action: none; cursor: pointer; }
  #touchBtns button.held { background: rgba(76,122,61,0.85); color: #eaf5e2; }

  #setup button:hover { color: #eaf5e2; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>

<div id="vitals" class="panel">
  <div class="label">VITALS</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="vrow"><span id="hpnum">100 / 100</span><span id="med">×1 [F] HEAL</span></div>
</div>

<div id="score" class="panel">
  <div class="label">WAVE</div>
  <div id="wave">1</div>
  <div class="row" id="kills">KILLS 0</div>
  <div class="row" id="time">TIME 0:00</div>
</div>

<div id="weapon" class="panel">
  <div id="wname">PISTOL</div>
  <div id="ammo">12 <small>/ 60</small></div>
</div>

<div id="peers" class="panel"></div>
<button id="serverBtn" title="Room server">server</button>

<div id="setup" hidden>
  <div class="box">
    <h2>ROOM SERVER</h2>
    <p>This copy of co-op needs the address of a room server.<br>
       Paste the one your host gave you — it looks like this:</p>
    <p style="color:#cfe3c6"><b>https://something.onrender.com</b></p>
    <input id="setupHost" type="url" spellcheck="false" autocapitalize="off"
           placeholder="https://your-room-server.example.com">
    <div class="row">
      <button id="setupSave" class="main">Save</button>
      <button id="setupCancel">Cancel</button>
    </div>
  </div>
</div>
<div id="hint">WASD move · mouse aim · click fire · R reload · F medkit · Shift sprint</div>
<div id="state"></div>

<div id="touchBtns">
  <button id="btnRun" type="button">run</button>
  <button id="btnReload" type="button">reload</button>
  <button id="btnHeal" type="button">heal</button>
</div>

<script src="./render.js"></script>
<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  let room = (params.get('room') || '').toUpperCase();
  let me = params.get('id') || null;

  /* Which room server to talk to. Empty means "the server this page came
     from"; a standalone copy (the Android bundle, a static host) names it with
     ?host= or remembers it locally. */
  function readHost() {
    let h = params.get('host') || '';
    if (!h) { try { h = localStorage.getItem('rotruin.coop.host') || ''; } catch (e) {} }
    h = String(h).trim();
    if (!h) return '';
    if (!/^https?:\/\//i.test(h)) h = 'https://' + h;
    return h.replace(/\/+$/, '');
  }
  const HOST = readHost();
  const url = p => HOST + p;

  // no room in the address: make one and put it in the URL, so the address in
  // the bar is the invite and a friend lands in the same room
  if (!room) {
    const A = 'ACDEFGHJKLMNPQRTUVWXY';
    room = '';
    for (let i = 0; i < 4; i++) room += A[Math.floor(Math.random() * A.length)];
    const u = new URL(location.href);
    u.searchParams.set('room', room);
    history.replaceState(null, '', u);
  }

  const cv = document.getElementById('game');
  const R = window.RTRender;
  if (!R) { document.getElementById('state').textContent = 'render.js failed to load'; return; }

  R.init(cv, { dprCap: 2 });
  R.buildPatterns();

  let VW = 0, VH = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    VW = cv.clientWidth; VH = cv.clientHeight;
    cv.width = Math.floor(VW * DPR);
    cv.height = Math.floor(VH * DPR);
    R.resize(VW, VH);
  }
  addEventListener('resize', resize);
  resize();

  /* ---------------- world from the server ---------------- */
  let prev = null, next = null, prevAt = 0, nextAt = 0, connected = false, events = 0;
  const cam = { x: 0, y: 0, init: false };

  function myPlayer() {
    if (!next) return null;
    return next.players.find(p => p.id === me) || null;
  }

  /* the client draws a blend between the last two snapshots; it never predicts,
     it just avoids showing a slideshow at 20 snapshots a second */
  function blended() {
    if (!next) return null;
    if (!prev) return next;
    const t = Math.min(1, (performance.now() - nextAt) / 50);
    const zb = new Map(prev.zombies.map(z => [z.id, z]));
    const pb = new Map(prev.players.map(p => [p.id, p]));
    return {
      ...next,
      zombies: next.zombies.map(z => {
        const o = zb.get(z.id);
        return o ? { ...z, x: o.x + (z.x - o.x) * t, y: o.y + (z.y - o.y) * t } : z;
      }),
      players: next.players.map(p => {
        const o = pb.get(p.id);
        return o ? { ...p, x: o.x + (p.x - o.x) * t, y: o.y + (p.y - o.y) * t } : p;
      })
    };
  }

  let es = null;
  function connect() {
    es = new EventSource(url('/events?room=' + encodeURIComponent(room) + '&id=' + encodeURIComponent(me)));
    es.onopen = () => { connected = true; };
    es.onerror = () => { connected = false; };
    es.onmessage = ev => {
      try {
        const snap = JSON.parse(ev.data);
        prev = next; prevAt = nextAt;
        next = snap; nextAt = performance.now();
        events++;
      } catch (e) {}
    };
  }

  (async function join() {
    if (!me) {
      try {
        const r = await fetch(url('/free-id?room=' + encodeURIComponent(room)));
        me = (await r.json()).id;
      } catch (e) {
        me = 'p' + Math.floor(Math.random() * 900 + 10);
      }
    }
    connect();
  })();

  /* stand-alone copies (the Android bundle, any static host) need the server
     address once; same-origin hosting never shows this */
  const setupEl = document.getElementById('setup');
  const setupInput = document.getElementById('setupHost');
  setupInput.value = HOST;
  function openSetup() { setupEl.hidden = false; setupInput.focus(); }
  document.getElementById('serverBtn').addEventListener('click', openSetup);
  document.getElementById('setupCancel').addEventListener('click', () => { setupEl.hidden = true; });
  document.getElementById('setupSave').addEventListener('click', () => {
    let v = setupInput.value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    v = v.replace(/\/+$/, '');
    try { localStorage.setItem('rotruin.coop.host', v); } catch (e) {}
    location.reload();
  });
  if (!HOST && location.protocol === 'file:') openSetup();

  /* ---------------- input ---------------- */
  const keys = new Set();
  const mouse = { x: 0, y: 0, down: false };

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', 'r', 'f', 'shift'].includes(k) || k.startsWith('arrow')) e.preventDefault();
    keys.add(k);
  });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => keys.clear());
  cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  cv.addEventListener('mousedown', () => { mouse.down = true; });
  addEventListener('mouseup', () => { mouse.down = false; });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------------- phone controls ---------------- */
  let touchUI = false;
  try {
    touchUI = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
  } catch (e) {}
  if (touchUI) document.body.classList.add('touch');

  const touch = {
    move: { active: false, id: null, ox: 0, oy: 0, nx: 0, ny: 0 },
    aim:  { active: false, id: null, ox: 0, oy: 0, nx: 0, ny: 0 },
    run: false, reload: false, heal: false
  };

  function stickRadius() { return Math.max(44, Math.min(84, Math.min(VW, VH) * 0.13)); }

  function updateStick(s, x, y) {
    const R = stickRadius();
    let dx = x - s.ox, dy = y - s.oy;
    const d = Math.hypot(dx, dy);
    if (d > R) {
      s.ox += dx * (1 - R / d);
      s.oy += dy * (1 - R / d);
      dx = x - s.ox; dy = y - s.oy;
    }
    s.nx = dx / R; s.ny = dy / R;
  }

  function releaseSticks() {
    touch.move.active = false; touch.move.id = null; touch.move.nx = 0; touch.move.ny = 0;
    touch.aim.active = false; touch.aim.id = null; touch.aim.nx = 0; touch.aim.ny = 0;
  }

  /* the three action buttons are real buttons, so a thumb cannot miss them
     inside a canvas viewport that may be 390 pixels wide */
  [['btnRun', 'run'], ['btnReload', 'reload'], ['btnHeal', 'heal']].forEach(([id, key]) => {
    const b = document.getElementById(id);
    if (!b) return;
    const down = e => { e.preventDefault(); touch[key] = true; b.classList.add('held'); };
    const up = e => { e.preventDefault(); touch[key] = false; b.classList.remove('held'); };
    b.addEventListener('touchstart', down, { passive: false });
    b.addEventListener('touchend', up, { passive: false });
    b.addEventListener('touchcancel', up, { passive: false });
    b.addEventListener('mousedown', down);
    b.addEventListener('mouseup', up);
    b.addEventListener('mouseleave', up);
  });

  /* left half of the screen is the move stick, right half aims and fires */
  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!touchUI) { touchUI = true; document.body.classList.add('touch'); }
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY;
      if (x < VW / 2) {
        if (!touch.move.active) {
          touch.move.active = true; touch.move.id = t.identifier;
          touch.move.ox = x; touch.move.oy = y; touch.move.nx = 0; touch.move.ny = 0;
        }
      } else if (!touch.aim.active) {
        touch.aim.active = true; touch.aim.id = t.identifier;
        touch.aim.ox = x; touch.aim.oy = y; touch.aim.nx = 0; touch.aim.ny = 0;
      }
    }
  }, { passive: false });

  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (touch.move.active && t.identifier === touch.move.id) updateStick(touch.move, t.clientX, t.clientY);
      else if (touch.aim.active && t.identifier === touch.aim.id) updateStick(touch.aim, t.clientX, t.clientY);
    }
  }, { passive: false });

  function endTouches(e) {
    for (const t of e.changedTouches) {
      if (touch.move.active && t.identifier === touch.move.id) { touch.move.active = false; touch.move.id = null; touch.move.nx = 0; touch.move.ny = 0; }
      if (touch.aim.active && t.identifier === touch.aim.id) { touch.aim.active = false; touch.aim.id = null; touch.aim.nx = 0; touch.aim.ny = 0; }
    }
  }
  cv.addEventListener('touchend', e => { e.preventDefault(); endTouches(e); }, { passive: false });
  cv.addEventListener('touchcancel', endTouches, { passive: false });
  addEventListener('orientationchange', () => setTimeout(() => { releaseSticks(); resize(); }, 300));

  if (touchUI) {
    const h = document.getElementById('hint');
    if (h) {
      h.textContent = 'left thumb moves · right thumb aims and fires';
      h.style.display = 'block';
      h.style.bottom = 'auto';
      h.style.top = '46px';
      setTimeout(() => { h.style.display = ''; }, 6000);
    }
  }

  function buildInput() {
    const p = myPlayer();
    let mx = 0, my = 0;
    if (keys.has('w') || keys.has('arrowup')) my--;
    if (keys.has('s') || keys.has('arrowdown')) my++;
    if (keys.has('a') || keys.has('arrowleft')) mx--;
    if (keys.has('d') || keys.has('arrowright')) mx++;
    /* the left thumb adds to the keyboard, so both work at the same time */
    const mvMag = Math.hypot(touch.move.nx, touch.move.ny);
    if (touch.move.active && mvMag > 0.16) { mx += touch.move.nx; my += touch.move.ny; }

    const l = Math.hypot(mx, my);
    if (l > 0) { mx /= l; my /= l; }

    /* aim with the right thumb when it is dragging, otherwise with the mouse */
    const aimMag = Math.hypot(touch.aim.nx, touch.aim.ny);
    let aim;
    if (touch.aim.active && aimMag > 0.14) aim = Math.atan2(touch.aim.ny, touch.aim.nx);
    else if (p) aim = Math.atan2(mouse.y - (VH / 2 + (p.y - cam.y)), mouse.x - (VW / 2 + (p.x - cam.x)));

    return {
      room, id: me, mx, my,
      aim: Number.isFinite(aim) ? aim : undefined,
      fire: mouse.down || (touch.aim.active && aimMag > 0.34),
      reload: keys.has('r') || touch.reload,
      medkit: keys.has('f') || touch.heal,
      sprint: keys.has('shift') || touch.run || (touch.move.active && mvMag > 0.94)
    };
  }

  setInterval(() => {
    fetch(url('/input'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildInput()), keepalive: true
    }).catch(() => {});
  }, 33);

  /* ---------------- HUD ---------------- */
  const el = {
    fill: document.getElementById('fill'), hpnum: document.getElementById('hpnum'),
    med: document.getElementById('med'), wave: document.getElementById('wave'),
    kills: document.getElementById('kills'), time: document.getElementById('time'),
    wname: document.getElementById('wname'), ammo: document.getElementById('ammo'),
    peers: document.getElementById('peers'), state: document.getElementById('state')
  };
  const WNAME = { pistol: 'PISTOL', shotgun: 'SHOTGUN', rifle: 'RIFLE', smg: 'SMG', smoke: 'SMOKE', frag: 'FRAG' };

  function fmtTime(t) {
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function drawStick(ctx, s, color) {
    if (!s.active) return;
    const R = stickRadius();
    ctx.save();
    ctx.fillStyle = 'rgba(6,10,6,0.26)';
    ctx.beginPath(); ctx.arc(s.ox, s.oy, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(210,235,200,0.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(s.ox, s.oy, R, 0, Math.PI * 2); ctx.stroke();
    const tx = s.ox + s.nx * R, ty = s.oy + s.ny * R;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(tx, ty, R * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(tx, ty, R * 0.34, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function updateHud(snap) {
    const p = myPlayer();
    if (p) {
      const frac = Math.max(0, Math.min(1, p.hp / (p.mh || 100)));
      el.fill.style.width = (frac * 100).toFixed(1) + '%';
      el.fill.style.background = frac > 0.55 ? '#84c95f' : frac > 0.28 ? '#d9b23f' : '#d94339';
      el.hpnum.textContent = Math.ceil(p.hp) + ' / ' + (p.mh || 100);
      el.med.textContent = '×' + p.med + ' [F] HEAL';
      el.wname.textContent = WNAME[p.w] || p.w.toUpperCase();
      el.ammo.innerHTML = String(p.mag).padStart(2, '0') + ' <small>/ ' + p.res + '</small>';
    }
    el.wave.textContent = snap.wave;
    el.wave.style.color = snap.wave % 5 === 0 ? '#e0705a' : '#e8f3e0';
    el.kills.textContent = 'KILLS ' + snap.kills;
    el.time.textContent = 'TIME ' + fmtTime(snap.t || 0);
    el.peers.innerHTML = snap.players
      .map(q => '<div>' + q.id + ' · ' + Math.round(q.hp) + 'hp' + (q.alive ? '' : ' · DOWN') + '</div>')
      .join('') + '<div style="color:#6f8270">room ' + snap.room + ' · ' + snap.zombies.length + ' zombies</div>';
    el.state.textContent = connected ? '' : 'disconnected';
  }

  /* ---------------- frame ---------------- */
  // small diagnostic surface, handy when a host or a proxy misbehaves
  const debug = { events: 0, frames: 0, draws: 0, lastError: null, lastTick: null };
  window.__coop = debug;

  function frame(now) {
    requestAnimationFrame(frame);
    debug.frames++;
    try {
      frameBody(now);
    } catch (e) {
      debug.lastError = String(e && e.stack || e);
      el.state.textContent = 'render error: ' + e.message;
    }
  }

  function frameBody(now) {
    const snap = blended();
    if (!snap) {
      el.state.textContent = connected ? 'waiting for the first snapshot…' : 'connecting…';
      return;
    }
    debug.draws++;
    debug.lastTick = snap.tick;
    const p = myPlayer();
    if (p) {
      if (!cam.init) { cam.x = p.x; cam.y = p.y; cam.init = true; }
      const k = 0.22;
      cam.x += (p.x - cam.x) * k;
      cam.y += (p.y - cam.y) * k;
    }
    R.draw(snap, me, cam, now / 1000);

    const ctx = cv.getContext('2d');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // the two thumbs, drawn where they actually are
    drawStick(ctx, touch.move, 'rgba(143,212,106,0.8)');
    drawStick(ctx, touch.aim, 'rgba(240,215,138,0.85)');

    // crosshair, mouse only: a phone has no pointer to draw it at
    if (touchUI) { updateHud(snap); return; }
    ctx.strokeStyle = 'rgba(232,243,224,0.75)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 7, 0, Math.PI * 2);
    ctx.moveTo(mouse.x - 12, mouse.y); ctx.lineTo(mouse.x - 4, mouse.y);
    ctx.moveTo(mouse.x + 4, mouse.y); ctx.lineTo(mouse.x + 12, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 12); ctx.lineTo(mouse.x, mouse.y - 4);
    ctx.moveTo(mouse.x, mouse.y + 4); ctx.lineTo(mouse.x, mouse.y + 12);
    ctx.stroke();

    updateHud(snap);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
