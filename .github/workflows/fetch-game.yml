name: Sync the published game files

# index.html, coop.html, the co-op app zip, the service worker, the manifest and
# the icons are published at the addresses below. This keeps the copies in the
# repository identical to them, so Pages serves what was actually built. It
# commits only when something actually changed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the published game files
        run: |
          set -e
          base=https://rot-ruin-wbadxv.freebuff.site
          curl -fsSL -o /tmp/game.zip $base/rot-and-ruin-phone.zip
          unzip -o /tmp/game.zip -d .
          rm -f /tmp/game.zip
          curl -fsSL -o rot-and-ruin-coop-app.zip $base/rot-and-ruin-coop-app.zip
          ls -l index.html coop.html rot-and-ruin-coop-app.zip
          git add index.html coop.html rot-and-ruin-coop-app.zip sw.js \
                  manifest.webmanifest icon-192.png icon-512.png \
                  icon-192-maskable.png icon-512-maskable.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "rot-and-ruin bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync the published game files [skip ci]"
          git push
