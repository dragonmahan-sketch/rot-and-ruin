name: Sync the co-op server

# The co-op room server is published as a zip at the address below. This keeps
# coop/ and render.yaml in the repo identical to it, so a host can build from
# this repository. It commits only when something actually changed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the co-op server bundle
        run: |
          set -e
          curl -fsSL -o /tmp/coop.zip https://rot-ruin-wbadxv.freebuff.site/rot-and-ruin-coop.zip
          unzip -o /tmp/coop.zip -d .
          rm -f /tmp/coop.zip
          ls -l coop
          git add coop render.yaml
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "rot-and-ruin bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync the co-op room server [skip ci]"
          git push
