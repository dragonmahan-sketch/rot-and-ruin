name: Sync the co-op room server (manual)

# Kept only for a manual run from the Actions tab. The automatic sync lives in
# fetch-game.yml now, which publishes the room server along with the game files
# in one job — two separate workflows pushed at the same moment and the second
# one was always rejected.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the published room server
        run: |
          set -e
          base=https://rot-ruin-wbadxv.freebuff.site
          curl -fsSL -o /tmp/coop.zip $base/rot-and-ruin-coop.zip
          rm -rf coop
          unzip -q -o /tmp/coop.zip -d .
          rm -f /tmp/coop.zip
          ls -l coop/server.js render.yaml
          git add -A coop render.yaml
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "rot-and-ruin bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync the co-op room server [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
            sleep 3
          done
          exit 1
